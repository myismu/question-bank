name: Images

# 构建并推送镜像到 GHCR（GitHub 容器仓库）
# 推 main 自动执行，也可在 Actions 页面手动运行
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送镜像到 GHCR 需要

jobs:
  # ============ 后端服务镜像（先在 CI 打出 jar，再按 Dockerfile 打镜像） ============
  backend-images:
    name: 后端镜像
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 打包 jar（跳过测试：测试已由 CI 流水线完成）
        run: mvn -B -s .mvn/ci-settings.xml -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 question-bank-service
        uses: docker/build-push-action@v6
        with:
          context: service/question-bank-service
          push: true
          tags: |
            ghcr.io/myismu/question-bank/question-bank-service:latest
            ghcr.io/myismu/question-bank/question-bank-service:${{ github.sha }}

  # ============ 前端镜像（两个前端分别构建） ============
  frontend-images:
    name: 前端镜像
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qb-web
            context: Web/QuestionBank-Web
          - name: qb-admin
            context: Web/QuestionBank-Admin
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/myismu/question-bank/${{ matrix.name }}:latest
            ghcr.io/myismu/question-bank/${{ matrix.name }}:${{ github.sha }}
