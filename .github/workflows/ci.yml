name: CI

on:
  push:                # 任何分支推送都跑
  pull_request:        # PR 提交时也跑，合入前就有反馈
  workflow_dispatch:   # 支持网页上手动点按钮重跑

permissions:
  contents: read
  packages: read       # 拉取平台制品（GitHub 的 Maven 注册表要求认证）

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 后端：编译 + 测试 ============
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    # 拉取平台制品（common / api / 父 pom）：GitHub 的 Maven 注册表始终要求认证
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 编译并打包（含单元测试）
        run: mvn -B -s .mvn/ci-settings.xml clean package

  # ============ 前端：两个工程分别构建 ============
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 一个失败不取消另一个，两个结果都看到
      matrix:
        app: [Web/QuestionBank-Web, Web/QuestionBank-Admin]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        working-directory: ${{ matrix.app }}
        run: pnpm install --frozen-lockfile

      - name: 构建
        working-directory: ${{ matrix.app }}
        run: pnpm build
